name: ci

# Charter non-negotiables enforced here. Every gate is BLOCKING (never advisory —
# charter #15). Tests and E2E run on a NON-UTC clock (charter #8; retro #39).
on:
  push:
  pull_request:

# Least-privilege token (charter #15): every job reads the repo, nothing writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/New_York
  # App-boot vars the config module requires (placeholders; never real secrets).
  APP_ENV: development
  APP_URL: http://localhost:3000
  FIRM_TIMEZONE: America/New_York
  VERIN_STORE_DRIVER: pglite
  VERIN_DATA_DIR: .verin-data-ci
  SESSION_SECRET: ci-only-session-secret-not-a-real-secret-0000000000
  ESIGN_WEBHOOK_SECRET: ci-only-webhook-secret-not-a-real-secret-0000000000
  LOG_LEVEL: error

jobs:
  quality:
    name: quality (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  test:
    name: test (unit, integration, fitness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: unit + integration + complete fitness inventory
        run: pnpm exec tsx scripts/fitness-tests.ts

  knip:
    name: knip (dead-export / dead-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: knip
        run: pnpm exec knip

  e2e:
    name: e2e (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: e2e + axe
        run: pnpm exec playwright test
      - name: verify demo screenshots
        run: pnpm exec tsx scripts/demo-screen-artifacts.ts
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Walking-skeleton deliverable (v3 prompt 3): a screenshot of every required
      # demo screen, captured by e2e/demo-journey.spec.ts on every run.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: demo-screens
          path: demo-screens/
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the pinned gitleaks CLI directly over the full local history instead
      # of gitleaks-action@v2: on pull_request events the action first fetches
      # the PR's commits from the GitHub REST API, so a transient API 5xx crashes
      # the check before any scanning happens. Scanning the whole clone locally
      # needs no API token and covers a superset of the PR range.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: semgrep
        # `semgrep scan --error` is the self-contained blocking SAST gate: exit
        # non-zero on any finding. (`semgrep ci` targets the Semgrep AppSec
        # Platform — it needs SEMGREP_APP_TOKEN and rejects `--error`.)
        # `regex_dos` (njsscan) is a purely syntactic heuristic that flags EVERY
        # `regexp.test(x)` — it cannot tell user input from build-time source text
        # or startup config, and produced only false positives here (ADR-0017).
        # All other njsscan rules stay blocking; specific instances are triaged
        # in-code with `// nosemgrep: <rule> -- <reason>`.
        run: >-
          semgrep scan
          --config p/typescript --config p/react --config p/nodejsscan --config p/secrets
          --exclude-rule ajinabraham.njsscan.dos.regex_dos.regex_dos
          --error

  dependency-audit:
    name: dependency-audit (pnpm audit + license/vuln review)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
      - name: license audit (reviewed allowlist, deny GPL/AGPL/unknown)
        run: pnpm exec tsx scripts/license-audit.ts

  provenance-trace:
    name: provenance-trace (displayed metric -> source, charter #3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: provenance-trace
        # Schema half (fields carry provenance; synthetic can't feed compliance) +
        # DISPLAY half (Vale V12): every metric-class render carries source/asOf, and
        # a value DERIVED from synthetic input is itself a demonstration (ADR-0022).
        run: pnpm exec vitest run src/__tests__/fitness/provenance-required.test.ts src/__tests__/fitness/no-unlabeled-synthetic.test.ts src/__tests__/fitness/metric-provenance.test.ts src/__tests__/fitness/derived-provenance.test.ts src/__tests__/fitness/no-pii-in-audit-store.test.ts

  audit-chain-verify:
    name: audit-chain-verify (charter #13)
    runs-on: ubuntu-latest
    env:
      VERIN_DATA_DIR: .verin-data-ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: seed audit evidence
        run: pnpm exec tsx scripts/db-seed.ts
      - name: verify org audit chains
        run: pnpm exec tsx scripts/audit-chain-verify.ts

  v3-invariants:
    name: v3-invariants (phase-gated three-state report, ADR-0023)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: v3 invariant report (active-pass / active-fail / not-yet-active; fails on active-fail)
        run: pnpm exec tsx scripts/v3-invariants.ts

  golden-cases:
    name: golden-cases (prompt-2 truth-set completeness, captain-signoff-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: golden-case validation (every required field populated; vocabulary aligned; signoff honest)
        run: pnpm exec tsx scripts/golden-cases-validate.ts

  corpus:
    name: corpus (prompt-11 replay-corpus regeneration + provenance split)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: corpus validation (regenerate + byte-compare; labels, timestamps, intake, signoff)
        run: pnpm exec tsx scripts/corpus-validate.ts
      - name: corpus measurement report (split by provenance; refuses to blend)
        run: pnpm exec tsx scripts/corpus-report.ts

  world:
    name: world (populated-world regeneration + clean-slate guarantee)
    runs-on: ubuntu-latest
    # Everything else (TZ, APP_ENV, secrets, driver) comes from the workflow env
    # above; only the store path is this job's own, so two jobs never share one.
    env:
      VERIN_DATA_DIR: .verin-data-ci-world
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: world validation (regenerate + byte-compare; provenance, reconciliation, awkward cases)
        run: pnpm exec tsx scripts/world-validate.ts
      - name: clean-slate guarantee (a fresh instance carries zero fixture-marked rows)
        run: pnpm exec tsx scripts/db-migrate.ts && pnpm exec tsx scripts/fixture-purge-check.ts
      # The floor is the world's household count, well under the rows the seed
      # actually writes (households + people + open items): a seed that quietly
      # loaded nothing, or a sweep that stopped seeing the tables it lands in,
      # fails here instead of printing zeroes and exiting 0.
      - name: the seeded world is visible to the same check (a check that finds nothing proves nothing)
        run: pnpm exec tsx scripts/db-seed.ts && pnpm exec tsx scripts/fixture-purge-check.ts --report --expect-rows=100

  load-smoke:
    name: load-smoke (p95 regression gate, charter #11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: load-smoke
        env:
          LOG_LEVEL: warn
        run: pnpm exec tsx scripts/load-smoke.ts
