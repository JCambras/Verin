title = "Verin gitleaks configuration"

# Charter non-negotiable #15: secret scanning is a CI gate (gitleaks-class),
# failing (not advisory). Extends the default ruleset.
[extend]
useDefault = true

[allowlist]
description = "Placeholder templates and test-only non-secrets (not real credentials)"
# .env.example is placeholder-only and separately enforced by the
# no-secret-fallback / no-live-org-domain fitness fence.
paths = [
  '''\.env\.example$''',
  '''playwright\.config\.ts$''',
]
regexes = [
  '''CHANGEME_[A-Za-z0-9_]+''',
  '''e2e-only-[a-z-]+-not-a-real-secret-0+''',
  # Deliberately secret-shaped fixture in the no-secret-fallback fence test
  # (src/__tests__/fitness/no-secret-fallback.test.ts) — proves the placeholder
  # check rejects a real-looking value. Not a live credential. Allowlisted by the
  # exact literal (not the file) so a genuine secret added to that file is still
  # caught. A `gitleaks:allow` inline comment cannot cover it: the value was
  # introduced in an earlier commit and gitleaks scans the whole PR range.
  '''sk_live_51H8xQ2eZvKYlo2C''',
  # Demo-skeleton fake idempotency key (src/app/demo/data.ts IDS, D-036). It is a
  # displayed fixture identifier (the e2e journey asserts it on screen and it prints
  # on the decision record), not a credential; generic-api-key fires only because the
  # field name contains "Key" and the value clears the entropy bar. Allowlisted by the
  # exact literal (not the file) so a genuine secret added to data.ts is still caught.
  # Same reason as above, an inline `gitleaks:allow` cannot cover it: the value landed
  # in an earlier commit of the PR range.
  '''mm-smiths-renovation-aug15-4c7f''',
  # Replay-corpus `generationToken` of the CS-segmented-withdrawal-schedule case
  # (fixtures/corpus/synthetic/, v3 prompt 11, ADR-0034). It holds NO secret entropy:
  # it is the first 8 bytes of sha256 over CORPUS_SEED, the case path, the field name
  # and "token" joined by the ASCII unit separator (scripts/corpus/seed.ts
  # deriveToken), and every input is a committed public constant, so anyone with the
  # clone recomputes it exactly. generic-api-key fires only because the field name ends
  # in "Token" and a digest clears the entropy bar.
  # Allowlisted by the exact literal (not the corpus path) so a genuine secret added to
  # a fixture is still caught, and so a regenerated corpus re-proves its own tokens
  # here rather than inheriting a blanket path escape. This value reaches the scan from
  # a sibling branch, not from HEAD: the CI job checks out with fetch-depth 0 and scans
  # every ref, so an inline `gitleaks:allow` in the fixture cannot cover it.
  '''79ac0f487563da1a''',
  # Populated-world fixture KEYS (fixtures/world/**, ADR-0057). Each is a
  # human-readable slug that identifies a record inside the generated
  # demonstration world - a household, a bank instruction, a model portfolio -
  # and none carries secret entropy or grants access to anything:
  #   garibaldi-thandiwe-22 : a derived household key, <surname>-<given name>-<slot>
  #   fairmont-5520 / fairmont-9014 / willowbank-6031 : bank-instruction keys,
  #                          <bank slug>-<the masked last four already shown on screen>
  #   conservative-40-60   : a model-portfolio key, hand-owned in spec/roster.json
  # generic-api-key fires only because the JSON field holding them is named "key"
  # and a hyphenated slug clears the entropy bar - the same reason
  # mm-smiths-renovation-aug15-4c7f above is listed. Allowlisted by the EXACT
  # LITERAL rather than by the fixtures/world path, so a genuine secret added to a
  # world file is still caught, and so a regenerated world re-proves its own keys
  # here rather than inheriting a blanket path escape. An inline `gitleaks:allow`
  # cannot cover them: the CI job checks out with fetch-depth 0 and scans every
  # ref, so the values reach the scan from commits other than HEAD.
  '''garibaldi-thandiwe-22''',
  '''fairmont-5520''',
  '''fairmont-9014''',
  '''willowbank-6031''',
  '''conservative-40-60''',
]
